server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend through Docker's DNS at request time (cached 10s) instead of once at
    # startup, so a recreated container with a new IP doesn't leave nginx proxying to a dead
    # address. The variable in proxy_pass is what forces the re-resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend blu-ray-index-go-prod;

    location /api/ {
        proxy_pass http://$backend:8140;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
